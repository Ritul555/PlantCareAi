version: '3.8'

services:
  # ===========================
  # PostgreSQL Database
  # ===========================
  db:
    image: postgres:15-alpine
    container_name: plantcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantcare_pass}
      POSTGRES_DB: ${POSTGRES_DB:-plantcare_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantcare_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # FastAPI Backend (optional — can also run locally)
  # ===========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantcare-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plantcare_user}:${POSTGRES_PASSWORD:-plantcare_pass}@db:5432/${POSTGRES_DB:-plantcare_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: ${DEBUG:-true}
    volumes:
      - ./backend:/app
      - ./models:/models
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full  # Only starts with: docker-compose --profile full up

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
